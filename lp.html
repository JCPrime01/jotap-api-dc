<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bilhete Liberado</title>

<!-- META PIXEL -->
<script>
    !function(f,b,e,v,n,t,s)
    {if(f.fbq)return;n=f.fbq=function(){n.callMethod?
    n.callMethod.apply(n,arguments):n.queue.push(arguments)};
    if(!f._fbq)f._fbq=n;n.push=n;n.loaded=!0;n.version='2.0';
    n.queue=[];t=b.createElement(e);t.async=!0;
    t.src=v;s=b.getElementsByTagName(e)[0];
    s.parentNode.insertBefore(t,s)}(window, document,'script',
    'https://connect.facebook.net/en_US/fbevents.js');
    fbq('init', '961619428689288');
    fbq('track', 'PageView');

    async function dispararLead() {
      const eventId = 'CompleteRegistration' + Date.now();
      fbq('track', 'CompleteRegistration', {}, { eventID: eventId });
      await fetch('https://track-jp-production.up.railway.app/api/lead', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          fbp: document.cookie.match(/_fbp=([^;]+)/)?.[1] || null,
          fbc: document.cookie.match(/_fbc=([^;]+)/)?.[1] || null,
          userAgent: navigator.userAgent,
          eventId: eventId
        })
      });
    }
    </script>
    <noscript><img height="1" width="1" style="display:none"
    src="https://www.facebook.com/tr?id=961619428689288&ev=PageView&noscript=1"/></noscript>

<style>
* {
    box-sizing: border-box;
}

html, body {
    height: 100%;
    margin: 0;
    padding: 0;
    overflow: hidden; /* Mantém sem scroll */
}

body {
    font-family: Arial, Helvetica, sans-serif;
    background: radial-gradient(circle at center, #0f2a1f 0%, #000000 70%);
    color: white;
    text-align: center;
    display: flex;
    justify-content: center;
    align-items: center;
}

.container {
    width: 100%;
    max-width: 420px;
    height: 100dvh;
    padding: 10px 0 0 0;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    align-items: center;
}

/* BLOCO PRINCIPAL DENTRO DA TELA */
.main-content {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: space-evenly; /* Distribui melhor os elementos verticalmente */
    width: 100%;
    padding: 0 20px;
    flex: 1; 
}

/* FOTO DO TIPSTER MAIOR */
.profile-img {
    max-width: 250px;
    width: 60vw;
    height: auto;
    object-fit: contain;
}

.title-box h1 {
    font-size: 28px;
    color: #ff0000;
    margin: 0 0 6px 0;
    font-weight: bold;
    line-height: 1.1;
}

.subtext {
    font-size: 15px;
    color: #d9d9d9;
    margin: 0;
}

/* BOTÃO MAIS CENTRALIZADO */
.btn-wrapper {
    margin-top: 10px;
    margin-bottom: 10px;
}

.button {
    display: inline-block;
    background-color: #ff0000;
    color: white;
    padding: 16px 38px;
    font-size: 20px;
    font-weight: bold;
    border-radius: 12px;
    text-decoration: none;
    transition: 0.3s ease;
    animation: pulse 1.5s infinite;
}

.button:hover {
    background-color: #cc0000;
}

/* ANIMAÇÃO PULSO */
@keyframes pulse {
    0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(255,0,0,0.7); }
    70% { transform: scale(1.05); box-shadow: 0 0 0 12px rgba(255,0,0,0); }
    100% { transform: scale(1); }
}

/* BLOCO DO RODAPÉ (ALERT + COPYRIGHT + SELO) */
.footer-wrapper {
    width: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
}

.alert-box {
    padding: 0 20px;
}

.alert-box h2 {
    color: #00ff66;
    font-size: 16px;
    margin: 0 0 4px 0;
}

.alert-box p {
    color: #cccccc;
    font-size: 13px;
    margin: 0;
}

.footer {
    font-size: 11px;
    color: #777;
    padding: 0 20px;
}

/* SELO NO FIM DA PÁGINA (EXTENSO) */
.stamp-bottom {
    width: 100%;
    display: block;
    height: auto;
    margin: 0;
}
</style>

</head>
<body>

<div class="container">

    <!-- BLOCO SUPERIOR / CENTRAL -->
    <div class="main-content">
        <img src="foto-perfil-6.png" alt="Foto do Tipster" class="profile-img">

        <div class="title-box">
            <h1>BILHETE<br>LIBERADO</h1>
            <p class="subtext">Clique no botão abaixo pra pegar seu bilhete!</p>
        </div>

        <div class="btn-wrapper">
            <a href="https://d.searchoffice.uk/" class="button" onclick="dispararLead()">PEGAR AGORA</a>
        </div>
    </div>

    <!-- BLOCO INFERIOR -->
    <div class="footer-wrapper">
        <div class="alert-box">
            <h2>⚠ Entre e aguarde</h2>
            <p>As entradas serão enviadas em instantes!</p>
        </div>

        <div class="footer">
            Copyright © 2026 – Todos os direitos reservados
        </div>

        <img src="ESPORTIVA.png" alt="Selo Jotap OFC / Ministério da Fazenda" class="stamp-bottom">
    </div>

</div>

</body>
</html>
